<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f172a'/%3E%3Cpath d='M3 8h10M8 3v10' stroke='%235eead4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>选课容量监控仪表盘 · PHBS 26-27 Fall I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=1.1.0" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="hero-copy">
        <div class="badges" aria-label="版本与学期">
          <span class="chip chip-brand">PKU PHBS</span>
          <span class="chip" id="termChip">2026-2027 Fall I</span>
          <span class="chip chip-ver">v1.1 精装版</span>
        </div>
        <h1>选课容量监控仪表盘</h1>
        <p class="sub" id="subtitle">实时监控 12 门重点课程的已选人数、剩余余量与历史增长趋势</p>
      </div>
      <aside class="live-card" id="liveCard">
        <div class="live-row">
          <span class="pulse" aria-hidden="true"></span>
          <span id="liveLabel">等待同步</span>
        </div>
        <div class="live-time" id="liveTime">—</div>
        <div class="live-rel" id="liveRel">尚未采集</div>
      </aside>
    </header>

    <div class="banner" id="banner" hidden></div>

    <section class="metrics" id="metrics" aria-label="决策指标"></section>

    <section class="toolbar" aria-label="筛选与排序">
      <div class="seg" id="filters" role="tablist" aria-label="状态筛选"></div>
      <div class="toolbar-right">
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="搜索中文名、英文名、上课时间或方向…" autocomplete="off" />
        </label>
        <label class="sort">
          <span class="sr-only">排序</span>
          <select id="sort">
            <option value="default">默认推荐顺序</option>
            <option value="occupancy">按占用率从高到低</option>
            <option value="remaining">按剩余名额从少到多</option>
            <option value="enrolled">按已选人数从多到少</option>
            <option value="name">按课程名称拼音</option>
          </select>
        </label>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <section class="table-card">
      <div class="table-head">
        <div>
          <h2>关注课程汇总</h2>
          <p id="tableHint">重点课的占用、余量与上课时间</p>
        </div>
        <div class="legend" aria-label="状态图例">
          <span><i class="lg over"></i>超容 &gt;100%</span>
          <span><i class="lg tight"></i>紧张 75%–100%</span>
          <span><i class="lg ok"></i>充裕 &lt;75%</span>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>课程名称</th>
              <th>方向 / 备注</th>
              <th>状态</th>
              <th>已选</th>
              <th>名额上限</th>
              <th>剩余名额</th>
              <th>占用</th>
              <th>上课时间</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <div>数据来自北大汇丰硕博选课系统公开可见的已选人数，仅供个人选课参考，不是学院官方结果。</div>
      <div class="foot-meta">
        <span>PHBS Course Dashboard · v1.1</span>
        <a href="../">返回主页</a>
      </div>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./app.js?v=1.1.0"></script>
</body>
</html>
