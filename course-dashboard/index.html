<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHBS 26-27 Fall I 选课容量看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=1.0.1" />
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <main class="wrap">
    <header class="hero">
      <div>
        <div class="kicker">PHBS · 26-27 Fall I</div>
        <h1>选课容量看板</h1>
        <p class="sub">关注 12 门课的已选人数和名额上限。本地 Chrome 采集，不消耗模型额度。</p>
      </div>
      <div class="stamp" id="stamp"><b>—</b><span>等待快照</span></div>
    </header>
    <div class="status" id="status"></div>
    <section class="kpis" id="kpis"></section>
    <section class="grid" id="grid"></section>
    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th>课程</th>
            <th>已选</th>
            <th>名额</th>
            <th>剩余</th>
            <th>占用</th>
            <th>时间</th>
            <th>备注</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <footer>数据来自北大汇丰硕博选课系统公开可见的已选人数，仅供个人选课参考，不是学院官方结果。</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./app.js?v=1.0.1"></script>
</body>
</html>
