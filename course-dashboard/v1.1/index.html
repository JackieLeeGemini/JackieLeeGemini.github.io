<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHBS 26-27 Fall I 选课容量看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 背景氛围微质感光晕 -->
  <div class="bg-mesh">
    <div class="mesh-glow mesh-1"></div>
    <div class="mesh-glow mesh-2"></div>
    <div class="mesh-glow mesh-3"></div>
  </div>

  <main class="wrap">
    <!-- 顶部状态与标题 -->
    <header class="hero">
      <div class="hero-brand">
        <div class="kicker-group">
          <span class="kicker">PHBS · 26-27 Fall I</span>
          <span class="version-badge">v1.1 精装版</span>
        </div>
        <h1>选课容量监控看板</h1>
        <p class="sub">实时追踪 12 门重点关注课程选课人数、容量上限与历史增长趋势。</p>
      </div>

      <div class="hero-stamp" id="stamp">
        <div class="stamp-header">
          <span class="pulse-dot"></span>
          <span class="stamp-status">自动监控中</span>
        </div>
        <div class="stamp-time" id="stamp-time">—</div>
        <div class="stamp-rel" id="stamp-rel">等待快照数据</div>
      </div>
    </header>

    <!-- 异常状态告警条（如登录失效） -->
    <div class="status-banner" id="status"></div>

    <!-- 升级版 KPI 业务指标区 -->
    <section class="kpis" id="kpis">
      <article class="kpi-card" id="kpi-watch">
        <div class="kpi-icon-wrap icon-indigo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="kpi-content">
          <div class="kpi-label">关注课程</div>
          <div class="kpi-val" id="kpi-watch-val">—</div>
          <div class="kpi-sub" id="kpi-watch-sub">全量 37 门</div>
        </div>
      </article>

      <article class="kpi-card" id="kpi-over">
        <div class="kpi-icon-wrap icon-rose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="kpi-content">
          <div class="kpi-label">已超容预警</div>
          <div class="kpi-val" id="kpi-over-val">—</div>
          <div class="kpi-sub" id="kpi-over-sub">需重点调整</div>
        </div>
      </article>

      <article class="kpi-card" id="kpi-hot">
        <div class="kpi-icon-wrap icon-amber">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div class="kpi-content">
          <div class="kpi-label">最抢手课程</div>
          <div class="kpi-val hot-course-name" id="kpi-hot-val">—</div>
          <div class="kpi-sub" id="kpi-hot-sub">占用率最高</div>
        </div>
      </article>

      <article class="kpi-card" id="kpi-avg">
        <div class="kpi-icon-wrap icon-emerald">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div class="kpi-content">
          <div class="kpi-label">平均占用率</div>
          <div class="kpi-val" id="kpi-avg-val">—</div>
          <div class="kpi-sub" id="kpi-avg-sub">关注课程整体负荷</div>
        </div>
      </article>
    </section>

    <!-- 交互操作与筛选工具栏 -->
    <section class="toolbar">
      <div class="filter-chips" id="filter-chips">
        <button class="chip active" data-filter="all" id="chip-all">
          全部 <span class="chip-count" id="count-all">12</span>
        </button>
        <button class="chip chip-rose" data-filter="critical" id="chip-critical">
          🔴 已超容 <span class="chip-count" id="count-over">0</span>
        </button>
        <button class="chip chip-amber" data-filter="caution" id="chip-caution">
          🟡 紧张 (≥75%) <span class="chip-count" id="count-caution">0</span>
        </button>
        <button class="chip chip-emerald" data-filter="safe" id="chip-safe">
          🟢 充裕 (&lt;75%) <span class="chip-count" id="count-safe">0</span>
        </button>
      </div>

      <div class="controls-right">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="搜索课程 / 老师 / 备注..." autocomplete="off" />
          <button class="clear-btn" id="clear-search" aria-label="清除搜索">×</button>
        </div>

        <div class="sort-box">
          <select id="sort-select">
            <option value="default">默认推荐排序</option>
            <option value="fill-desc">按占用率从高到低</option>
            <option value="remaining-asc">按剩余名额从少到多</option>
            <option value="enrolled-desc">按已选人数从多到少</option>
            <option value="name-asc">按课程名称拼音</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 课程卡片 Grid -->
    <section class="grid" id="grid"></section>

    <!-- 底部明细数据表格 -->
    <section class="table-section">
      <div class="table-header">
        <div class="table-title">课程名额汇总明细</div>
        <div class="table-subtitle">包含全部关注课程的即时选课数据与进度</div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>课程名称</th>
              <th>方向/备注</th>
              <th>状态</th>
              <th>已选人数</th>
              <th>名额上限</th>
              <th>剩余名额</th>
              <th>占用进度</th>
              <th>上课时间</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- 底部版本与版权 -->
    <footer class="footer">
      <div class="footer-left">
        数据来自北大汇丰硕博选课系统公开可见的已选人数，仅供个人选课参考，不是学院官方结果。
      </div>
      <div class="footer-right">
        <span class="ver-tag">Version 1.1</span>
        <a href="./v1.0/" class="back-link">切换到 v1.0 经典版</a> · <a href="../" class="back-link">个人主页</a>
      </div>
    </footer>
  </main>

  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
